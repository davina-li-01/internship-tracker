<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#fff;width:180px;height:180px;overflow:hidden}
  svg{display:block;width:180px;height:180px}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#E4570B"/>
    </linearGradient>
    <mask id="gap">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="32" cy="14" r="10" fill="#000"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#fff" stroke-width="6" mask="url(#gap)"/>
  <circle cx="32" cy="32" r="8" fill="#fff"/>
  <circle cx="32" cy="14" r="6" fill="#fff"/>
</svg>
</body></html>
