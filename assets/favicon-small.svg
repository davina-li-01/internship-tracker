<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Orbit">
  <title>Orbit</title>
  <!--
    Simplified mark for 16px, where the full favicon.svg has too many elements
    to survive 256 pixels. Drops the satellite and keeps the ring plus centre —
    the same ◍ used as the sidebar brand mark. Geometry lands on whole pixels
    at 16px (viewBox scales by 0.25): stroke 6 -> 1.5px, centre r 8 -> 2px.
  -->
  <defs>
    <linearGradient id="tileSmall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#E4570B"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#tileSmall)"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#fff" stroke-width="6"/>
  <circle cx="32" cy="32" r="8" fill="#fff"/>
</svg>
