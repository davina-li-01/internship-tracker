<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Orbit">
  <title>Orbit</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <!-- rounded tile so the mark reads at 16px instead of dissolving -->
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <!-- the orbital path -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="#fff" stroke-width="3.5" opacity="0.9"/>
  <!-- the body at its centre -->
  <circle cx="32" cy="32" r="6.5" fill="#fff"/>
  <!-- a satellite on the path, so it reads as motion rather than a target -->
  <circle cx="32" cy="15" r="4.5" fill="#fff"/>
</svg>
