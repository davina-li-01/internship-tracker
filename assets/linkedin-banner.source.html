<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#fff}
  .banner{
    position:relative; width:var(--w); height:var(--h); overflow:hidden;
    background:linear-gradient(120deg,#FFF9F3 0%,#FEEEDD 55%,#FCE2C9 100%);
    font-family:Inter,system-ui,-apple-system,"SF Pro Display","Helvetica Neue",sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  /* Orbit rings bleeding off both edges — the product's own motif at scale,
     kept faint so the wordmark stays the only thing you read first. */
  .rings{position:absolute; inset:0; overflow:hidden}
  .ring{position:absolute; border-radius:50%; border:var(--rb) solid rgba(234,88,12,.11)}
  .dot{position:absolute; border-radius:50%; background:rgba(234,88,12,.13)}

  .lockup{position:relative; display:flex; align-items:center; gap:var(--gap)}
  .tile{
    width:var(--tile); height:var(--tile); border-radius:calc(var(--tile)*.2188);
    background:linear-gradient(135deg,#FB923C,#E4570B); flex:0 0 auto;
    box-shadow:0 var(--sh1) var(--sh2) rgba(228,87,11,.22);
  }
  .tile svg{display:block;width:100%;height:100%}
  .word{margin:0; font-size:var(--fs1); font-weight:800; letter-spacing:-.035em; color:#1C1917; line-height:1}
  .tag{margin:var(--tm) 0 0; font-size:var(--fs2); font-weight:500; color:#7A6A5E; line-height:1.3; letter-spacing:-.01em}
</style></head><body>
<div class="banner" id="b">
  <div class="rings" id="rings"></div>
  <div class="lockup">
    <div class="tile">
      <svg viewBox="0 0 64 64">
        <defs><mask id="gap"><rect width="64" height="64" fill="#fff"/><circle cx="32" cy="14" r="10" fill="#000"/></mask></defs>
        <circle cx="32" cy="32" r="18" fill="none" stroke="#fff" stroke-width="6" mask="url(#gap)"/>
        <circle cx="32" cy="32" r="8" fill="#fff"/>
        <circle cx="32" cy="14" r="6" fill="#fff"/>
      </svg>
    </div>
    <div>
      <p class="word">Orbit</p>
      <p class="tag" id="tag">Keep your people in orbit.</p>
    </div>
  </div>
</div>
<script>
  var p = new URLSearchParams(location.search);
  var W = +p.get("w") || 1584, H = +p.get("h") || 396;
  var s = document.documentElement.style;
  var k = H / 396;                       // one scale factor, so both sizes match
  s.setProperty("--w", W + "px");  s.setProperty("--h", H + "px");
  s.setProperty("--tile", Math.round(132*k) + "px");
  s.setProperty("--gap",  Math.round(34*k) + "px");
  s.setProperty("--fs1",  Math.round(84*k) + "px");
  s.setProperty("--fs2",  Math.round(27*k) + "px");
  s.setProperty("--tm",   Math.round(12*k) + "px");
  s.setProperty("--sh1",  Math.round(10*k) + "px");
  s.setProperty("--sh2",  Math.round(34*k) + "px");
  document.body.style.width = W + "px"; document.body.style.height = H + "px";

  // Rings placed relative to the canvas so both aspect ratios stay balanced.
  var R = document.getElementById("rings");
  [[-0.10,0.50,0.95,9],[0.06,0.50,0.55,7],[1.06,0.46,1.02,9],[0.92,0.48,0.58,7]]
    .forEach(function(c){
      var d = c[2]*H, el = document.createElement("div");
      el.className = "ring";
      el.style.cssText = "width:"+d+"px;height:"+d+"px;left:"+(c[0]*W-d/2)+"px;top:"+(c[1]*H-d/2)+"px;--rb:"+Math.round(c[3]*k)+"px";
      R.appendChild(el);
    });
  [[0.06,0.50,0.19],[0.92,0.48,0.20]].forEach(function(c){
    var d = c[2]*H, el = document.createElement("div");
    el.className = "dot";
    el.style.cssText = "width:"+d+"px;height:"+d+"px;left:"+(c[0]*W-d/2)+"px;top:"+(c[1]*H-d/2)+"px";
    R.appendChild(el);
  });
  document.title = "ready";
</script>
</body></html>
