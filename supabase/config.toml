# Orbit — Supabase CLI project config
#
# Committed on purpose: it holds no secrets, and without it `functions deploy`
# silently re-enables the JWT gate below.

project_id = "kctmclcjqpytswwyewti"

[functions.send-reminders]
# Edge Functions require a JWT Authorization header by default. This one is
# invoked by pg_cron, which has no signed-in user and therefore no JWT to send,
# so the gateway would reject every scheduled run with
# UNAUTHORIZED_NO_AUTH_HEADER before the function ever ran.
#
# Turning the gate off does NOT make the function unprotected. It checks the
# CRON_SECRET shared secret itself, on the first line of the handler, and
# returns 401 without it. That check is the auth.
#
# The alternative — leaving the gate on and having pg_cron send the publishable
# key — buys nothing: that key is already public in the browser, so anyone could
# satisfy the gate and would still be stopped by CRON_SECRET. Same protection,
# more moving parts.
verify_jwt = false
